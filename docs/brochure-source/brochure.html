<!doctype html>
<html><head><meta charset="utf-8">
<title>Catering website – feature guide – Penta Services</title>
<!-- A4 feature guide for the Marigold & Thyme demo. Text comes from strings/<lang>.json, injected by pdf.mjs as window.S. Render: node pdf.mjs <lang> -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box}
:root{--ink:#16241c;--green:#213528;--deep:#16241c;--brass:#d9861f;--brass2:#f4b860;--cream:#fbf5ea;--mut:#5b6a60;--line:#e6dccb;--serif:"Fraunces",Georgia,serif;--sans:"DM Sans",system-ui,sans-serif}
html[lang=ar]{--serif:"IBM Plex Sans Arabic",sans-serif;--sans:"IBM Plex Sans Arabic",sans-serif}
html[lang=zh]{--serif:"Noto Serif SC","Fraunces",serif;--sans:"Noto Sans SC","DM Sans",sans-serif}
body{margin:0;font:400 11pt/1.55 var(--sans);color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.page{width:210mm;height:297mm;position:relative;overflow:hidden;padding:20mm 17mm 22mm;background:#ffffff;page-break-after:always}
.page::before{content:"";position:absolute;inset:0 0 auto 0;height:4mm;background:linear-gradient(90deg,var(--green) 0 72%,var(--brass) 72%)}
.page.dark{background:radial-gradient(130mm 110mm at 100% 0%,rgba(201,154,75,.25),transparent 70%),linear-gradient(160deg,#0f1913,var(--deep) 60%,#0f1913);color:#fff}
.page.dark::before{display:none}
.page>*{position:relative}
.ring{position:absolute!important;right:-40mm;top:-40mm;width:150mm;height:150mm;border-radius:50%;border:1px solid rgba(225,191,127,.35);box-shadow:0 0 0 18mm rgba(225,191,127,.05),0 0 0 36mm rgba(225,191,127,.035)}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;color:var(--green);letter-spacing:-.005em}
.dark h1,.dark h2,.dark h3{color:#fff}
h1{font-size:40pt;line-height:1.04}h2{font-size:28pt;line-height:1.15;margin-bottom:4mm}h3{font-size:14.5pt;line-height:1.25;margin-bottom:1.5mm}
html[lang=ar] h1,html[lang=ar] h2{font-weight:600;line-height:1.35}html[lang=ar] h1{font-size:31pt}
h1 em,h2 em{font-style:italic;color:var(--brass)}.dark h1 em,.dark h2 em{color:var(--brass2)}
html[lang=ar] em,html[lang=zh] em{font-style:normal}
h4{font:700 11pt/1.35 var(--sans);margin:0 0 1mm;color:var(--green)}.dark h4{color:#fff}
.kick{display:flex;align-items:center;gap:3mm;font:700 8.4pt var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--brass);margin-bottom:4mm}.kick::before{content:"";width:10mm;height:1px;background:currentColor}
html[lang=ar] .kick,html[lang=zh] .kick{letter-spacing:.04em}
.dark .kick{color:var(--brass2)}
.lead{font-size:11.8pt;color:var(--mut);margin:0 0 5mm;max-width:172mm}.dark .lead{color:#cfd9cd}
.foot{position:absolute;left:17mm;right:17mm;bottom:8mm;display:flex;justify-content:space-between;align-items:center;gap:6mm;font-size:8pt;color:#6f7d72;border-top:1px solid var(--line);padding-top:2.5mm}.dark .foot{border-color:rgba(255,255,255,.18);color:#a7b5a4}
.foot img{height:7mm}.foot .fd{flex:1;text-align:center}.foot .pg{font-weight:800;color:var(--deep);background:var(--brass2);border-radius:50%;width:7mm;height:7mm;display:grid;place-items:center;font-size:8.4pt}
.frame{border-radius:3mm;overflow:hidden;background:#fff;box-shadow:0 8mm 16mm -9mm rgba(15,25,19,.5);border:1px solid rgba(0,0,0,.08)}
.frame .bar{display:flex;align-items:center;gap:1.4mm;padding:1.8mm 3mm;background:#efe6d6;direction:ltr}.frame .bar i{width:2.2mm;height:2.2mm;border-radius:50%;background:#cbbfae}.frame .bar span{margin-left:3mm;font-size:7.8pt;background:#fff;border-radius:2mm;padding:.5mm 3mm;color:var(--green)}
.frame .img{background-size:100% auto;background-repeat:no-repeat;background-position:top}
.plain{border-radius:3mm;overflow:hidden;box-shadow:0 6mm 14mm -9mm rgba(15,25,19,.45);border:1px solid rgba(0,0,0,.07);background:#fff}
.plain img{display:block;width:100%}
.cap{font-size:8.6pt;color:var(--mut);margin-top:2mm;text-align:center}.dark .cap{color:#a7b5a4}
.ticks{list-style:none;padding:0;margin:0}.ticks li{position:relative;padding-inline-start:7.5mm;margin-bottom:2.3mm;font-size:10.6pt;line-height:1.45}.ticks li::before{content:"✓";position:absolute;inset-inline-start:0;top:.5mm;width:5mm;height:5mm;border-radius:50%;background:var(--green);color:var(--brass2);font-size:7.5pt;display:grid;place-items:center;font-weight:800}
.dark .ticks li::before{background:rgba(255,255,255,.14)}
.why{background:var(--green);color:#fff;border-radius:4mm;padding:5mm 7mm;border-inline-start:2mm solid var(--brass)}.why b{display:block;font:700 8.4pt var(--sans);letter-spacing:.14em;color:var(--brass2);margin-bottom:1.5mm;text-transform:uppercase}.why p{margin:0;font-size:10.6pt;color:#e6ede3}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6mm}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:5mm}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:4mm}
.mt2{margin-top:2mm}.mt3{margin-top:3mm}.mt4{margin-top:4mm}.mt5{margin-top:5mm}.mt6{margin-top:6mm}.mt8{margin-top:8mm}
.card{background:#fff;border:1px solid var(--line);border-radius:4mm;padding:5mm}.card p{margin:1mm 0 0;font-size:10.2pt;color:var(--mut)}
.card.tint{background:var(--cream);border-color:transparent}
.dark .card{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16)}.dark .card p{color:#cfd9cd}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4mm;margin:6mm 0}
.stat{background:var(--green);border-radius:4mm;padding:5mm;min-height:30mm;color:#fff}.stat b{display:block;font:800 24pt/1 var(--sans);letter-spacing:-.02em;color:var(--brass2)}.stat span{display:block;font-size:9.6pt;line-height:1.4;color:#d3ddd1;margin-top:2.5mm}
.toc div{display:flex;justify-content:space-between;gap:4mm;padding:2.4mm 0;border-bottom:1px solid var(--line);font-size:11pt}.toc div span:last-child{color:var(--brass);font-weight:700}
.callout{display:flex;gap:4mm;align-items:flex-start;margin-bottom:3.4mm}.callout b.k{flex:none;width:7mm;height:7mm;border-radius:50%;background:var(--brass);color:#fff;display:grid;place-items:center;font-size:8.6pt;font-weight:800}
.callout p{margin:.4mm 0 0;font-size:10pt;line-height:1.45;color:var(--mut)}.callout h4{margin:0}
.dark .callout p{color:#cfd9cd}
.pill{display:inline-block;background:var(--cream);color:var(--green);font:600 9pt var(--sans);border:1px solid var(--line);border-radius:999px;padding:1.1mm 3.4mm;margin:0 1.4mm 2mm 0}
.phone{border-radius:7mm;background:#111;padding:1.8mm;box-shadow:0 6mm 14mm -6mm rgba(0,0,0,.5)}.phone>div{border-radius:5.5mm;background-size:100% auto;background-repeat:no-repeat;background-position:top;aspect-ratio:390/800}
.num{display:flex;gap:5mm;align-items:flex-start;margin-bottom:5mm}.num i{flex:none;width:10mm;height:10mm;border-radius:50%;background:var(--brass);display:grid;place-items:center;font:800 12pt var(--sans);font-style:normal;color:#fff}.num p{margin:1mm 0 0;font-size:10.6pt;color:#cfd9cd}
.free{display:inline-block;background:var(--brass);color:#fff;font:800 7.4pt var(--sans);letter-spacing:.08em;text-transform:uppercase;border-radius:1.5mm;padding:.6mm 2mm;margin-inline-start:2mm;vertical-align:2px}
.inc{display:grid;grid-template-columns:1fr 1fr;gap:3mm}.inc .card{padding:4mm 5mm}
.price{display:flex;gap:4mm}.price>div{flex:1;border-radius:4mm;padding:5mm;background:var(--brass);color:#fff}.price b{display:block;font:800 16pt/1.2 var(--sans);margin:1mm 0}.price span{font-size:9.2pt;font-weight:600}
.big{font:500 16pt/1.4 var(--serif)}
.cover-img{position:absolute!important;inset:0;width:100%;height:100%;object-fit:cover;opacity:.32}
.cover-shade{position:absolute!important;inset:0;background:linear-gradient(180deg,rgba(15,25,19,.55),rgba(22,36,28,.92) 45%,rgba(15,25,19,.98) 80%)}
.logo{height:12mm}
</style></head><body>
<script src="pages.js"></script>
</body></html>
